<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrawlStats Tracker</title>
    <style>
      :root {
        --bg: #090d16;
        --surface: #111827;
        --surface-2: #1a2438;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f8fafc;
        --muted: #94a3b8;
        --gold: #facc15;
        --blue: #38bdf8;
        --win: #22c55e;
        --loss: #ef4444;
        --draw: #64748b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 0%, rgba(56, 189, 248, 0.16), transparent 40%),
          radial-gradient(circle at 85% 10%, rgba(250, 204, 21, 0.14), transparent 40%),
          var(--bg);
        padding: 32px 16px 60px;
      }

      .wrap { max-width: 820px; margin: 0 auto; }

      .hero { text-align: center; margin-bottom: 26px; }

      .pill {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--gold);
        background: rgba(250, 204, 21, 0.12);
        border: 1px solid rgba(250, 204, 21, 0.3);
        margin-bottom: 12px;
      }

      h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 2.5rem); font-weight: 800; }

      .hero p { margin: 8px 0 0; color: var(--muted); font-size: 0.98rem; }

      .search-bar {
        display: flex;
        gap: 10px;
        background: var(--surface);
        padding: 8px;
        border-radius: 16px;
        border: 1px solid var(--border);
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
        margin-bottom: 18px;
      }

      .search-bar input {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 1rem;
        padding: 10px 14px;
        outline: none;
      }

      .search-bar button {
        border: none;
        border-radius: 12px;
        padding: 12px 22px;
        font-size: 0.98rem;
        font-weight: 700;
        color: #090d16;
        background: linear-gradient(135deg, var(--gold), #f59e0b);
        cursor: pointer;
        transition: transform 0.12s ease, filter 0.12s ease;
      }

      .search-bar button:hover { filter: brightness(1.06); transform: translateY(-1px); }

      .search-bar button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

      .alert {
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        margin-bottom: 18px;
        font-size: 0.95rem;
      }

      .alert.error {
        background: rgba(239, 68, 68, 0.14);
        border-color: rgba(239, 68, 68, 0.45);
        color: #fecaca;
      }

      .hidden { display: none; }

      .profile {
        display: flex;
        align-items: center;
        gap: 18px;
        background: linear-gradient(145deg, var(--surface-2), var(--surface));
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 20px;
        margin-bottom: 16px;
      }

      .avatar {
        width: 82px;
        height: 82px;
        border-radius: 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        object-fit: cover;
        flex-shrink: 0;
      }

      .profile h2 { margin: 0; font-size: 1.5rem; }

      .tag-text { margin: 4px 0; color: var(--blue); font-weight: 600; font-size: 0.92rem; }

      .club-text { margin: 0; color: var(--muted); font-size: 0.92rem; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 26px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        text-align: center;
      }

      .card span { display: block; color: var(--muted); font-size: 0.84rem; margin-bottom: 6px; }

      .card strong { font-size: 1.45rem; color: var(--gold); }

      .section-head { margin: 0 0 12px; font-size: 1.15rem; }

      .battles {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .battle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 5px solid var(--draw);
        border-radius: 14px;
        padding: 14px 16px;
      }

      .battle.victory { border-left-color: var(--win); }
      .battle.defeat { border-left-color: var(--loss); }

      .battle-title { font-weight: 700; }

      .battle-meta { display: block; color: var(--muted); font-size: 0.86rem; margin-top: 3px; }

      .battle-outcome { text-align: right; }

      .battle-outcome strong { display: block; font-size: 0.94rem; }

      .battle-outcome small { color: var(--muted); font-size: 0.82rem; }

      @media (max-width: 560px) {
        .search-bar { flex-direction: column; }
        .profile { flex-direction: column; text-align: center; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <div class="pill">BRAWL STARS • STATS</div>
        <h1>BrawlStats Tracker</h1>
        <p>Entre un Tag joueur (ex. <strong>#2PP</strong> ou <strong>2PP</strong>) pour voir son profil et ses 10 dernières parties.</p>
      </header>

      <form id="form" class="search-bar">
        <input id="tagInput" type="text" placeholder="Ex : #2PP9Y8" autocomplete="off" required />
        <button id="submitBtn" type="submit">Rechercher</button>
      </form>

      <div id="alert" class="alert hidden"></div>

      <section id="content" class="hidden">
        <div class="profile">
          <img id="icon" class="avatar" src="" alt="Icône du joueur" />
          <div>
            <h2 id="name"></h2>
            <p id="tag" class="tag-text"></p>
            <p id="club" class="club-text"></p>
          </div>
        </div>

        <div class="grid">
          <div class="card"><span>Trophées</span><strong id="trophies">0</strong></div>
          <div class="card"><span>Record</span><strong id="highest">0</strong></div>
          <div class="card"><span>Victoires 3v3</span><strong id="v3v3">0</strong></div>
          <div class="card"><span>Brawlers</span><strong id="brawlers">0</strong></div>
        </div>

        <h3 class="section-head">10 dernières parties</h3>
        <ul id="battles" class="battles"></ul>
      </section>
    </div>

    <script>
      // ---------------------------------------------------------------------
      // Appel RELATIF à la page : même origine, donc pas de CORS.
      // Le chemin /api ne correspond à aucun asset statique, c'est donc le
      // Worker qui le traite. Ne JAMAIS remettre une URL absolue ici.
      // ---------------------------------------------------------------------
      const API_PATH = "/api";

      const form = document.getElementById("form");
      const tagInput = document.getElementById("tagInput");
      const submitBtn = document.getElementById("submitBtn");
      const alertBox = document.getElementById("alert");
      const contentBox = document.getElementById("content");
      const battlesList = document.getElementById("battles");

      function showAlert(text, isError = false) {
        alertBox.textContent = text;
        alertBox.className = isError ? "alert error" : "alert";
        alertBox.classList.remove("hidden");
      }

      function hideAlert() {
        alertBox.classList.add("hidden");
      }

      function cleanTag(raw) {
        return raw.trim().toUpperCase().replace(/^#+/, "").replace(/\s+/g, "");
      }

      function getBrawlerName(battle, tag) {
        const target = `#${tag}`;
        const groups =
          battle.battle?.teams || (battle.battle?.players ? [battle.battle.players] : []);
        for (const team of groups) {
          for (const player of team) {
            if (player.tag === target && player.brawler?.name) {
              return player.brawler.name;
            }
          }
        }
        return "Brawler inconnu";
      }

      async function fetchPlayerData(tag) {
        let res;
        try {
          res = await fetch(`${API_PATH}?tag=${encodeURIComponent(tag)}`, {
            headers: { Accept: "application/json" },
          });
        } catch {
          throw new Error("Impossible de joindre le serveur (réseau).");
        }

        const rawText = await res.text();
        let data = null;
        if (rawText) {
          try {
            data = JSON.parse(rawText);
          } catch {
            data = null;
          }
        }

        if (!res.ok) {
          throw new Error(
            (data && (data.error || data.message)) || `Erreur serveur (${res.status})`
          );
        }

        if (!data) {
          throw new Error(
            "Réponse invalide du serveur : le Worker n'a pas renvoyé de JSON. " +
              "Vérifie qu'il est bien déployé et que le secret BRAWL_API_KEY existe."
          );
        }

        return data;
      }

      function render(profile, battlelog, tag) {
        const iconId = profile.icon?.id;
        document.getElementById("icon").src = iconId
          ? `https://cdn.brawlify.com/profile-icons/regular/${iconId}.png`
          : "";

        document.getElementById("name").textContent = profile.name || "Joueur";
        document.getElementById("tag").textContent = profile.tag || `#${tag}`;
        document.getElementById("club").textContent = profile.club?.name
          ? `Club : ${profile.club.name}`
          : "Aucun club";

        document.getElementById("trophies").textContent = profile.trophies ?? 0;
        document.getElementById("highest").textContent = profile.highestTrophies ?? 0;
        document.getElementById("v3v3").textContent = profile["3vs3Victories"] ?? 0;
        document.getElementById("brawlers").textContent = profile.brawlers?.length ?? 0;

        battlesList.innerHTML = "";
        const items = (Array.isArray(battlelog) ? battlelog : battlelog?.items || []).slice(0, 10);

        if (items.length === 0) {
          const li = document.createElement("li");
          li.className = "battle";
          li.textContent = "Aucune partie récente trouvée.";
          battlesList.appendChild(li);
          contentBox.classList.remove("hidden");
          return;
        }

        for (const item of items) {
          const result = item.battle?.result || "draw";
          const mode = item.battle?.mode || item.event?.mode || "Mode inconnu";
          const map = item.event?.map || "Map inconnue";
          const brawler = getBrawlerName(item, tag);
          const change = item.battle?.trophyChange;

          const label =
            result === "victory" ? "Victoire" : result === "defeat" ? "Défaite" : "Égalité";
          const delta =
            typeof change === "number" ? `${change > 0 ? "+" : ""}${change} trophées` : "";

          const li = document.createElement("li");
          li.className = `battle ${result}`;

          const left = document.createElement("div");
          const title = document.createElement("span");
          title.className = "battle-title";
          title.textContent = `${mode} — ${map}`;
          const meta = document.createElement("span");
          meta.className = "battle-meta";
          meta.textContent = `Brawler : ${brawler}`;
          left.append(title, meta);

          const right = document.createElement("div");
          right.className = "battle-outcome";
          const strong = document.createElement("strong");
          strong.textContent = label;
          const small = document.createElement("small");
          small.textContent = delta;
          right.append(strong, small);

          li.append(left, right);
          battlesList.appendChild(li);
        }

        contentBox.classList.remove("hidden");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const tag = cleanTag(tagInput.value);
        if (!tag) {
          showAlert("Entre un Tag joueur valide.", true);
          return;
        }

        contentBox.classList.add("hidden");
        showAlert("Chargement en cours...");
        submitBtn.disabled = true;

        try {
          const data = await fetchPlayerData(tag);
          hideAlert();
          render(data.profile, data.battlelog, tag);
        } catch (err) {
          showAlert(err.message || "Erreur inconnue.", true);
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
